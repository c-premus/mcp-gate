# Grafana alert rule provisioning for mcp-gate JWKS health.
#
# Copy into your Grafana provisioning directory (the alerting/ subdirectory)
# and reload. The folder "mcp-gate" is created automatically by Grafana at
# load time.
#
# These rules are provisioned without notification_settings — they use the
# default notification policy (root route) of the Alertmanager configured in
# Grafana. Add routing to the Alertmanager config tree to target them via the
# severity label below.
#
# Multi-gate deployments: these rules deliberately carry NO `service` label of
# their own. Grafana applies rule-level labels on top of the query's labels, so
# a hardcoded `service` would overwrite the one the scrape config attaches and
# every gate's alerts would be attributed to the same instance. Instead, each
# rule aggregates `by (service)` and templates `$labels.service` into its
# summary, so one job scraping several gates produces one correctly-named alert
# instance per gate. See docs/setup.md ("Scraping several gates") for the
# scrape-config contract that supplies the label. If your scrape config does
# not set `service`, the label is simply absent and the summaries fall back to
# a generic "mcp-gate" — identical to single-gate behaviour.

apiVersion: 1

groups:
  - orgId: 1
    name: mcp-gate-jwks
    folder: mcp-gate
    interval: 1m
    rules:
      # Critical: no signing keys cached means every JWT validation will fail.
      # This is a full authentication outage for mcp-gate.
      - uid: mcp-gate-jwks-keys-empty
        title: mcp-gate JWKS Keys Empty
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: mcpgate_jwks_keys_loaded{job="mcp-gate"}
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: >-
            {{ if $labels.service }}{{ $labels.service }}{{ else }}mcp-gate{{ end }}
            has zero cached JWKS signing keys
          description: |
            mcp-gate cannot validate any JWT — all authenticated requests will
            be rejected. Check the JWKS endpoint reachability, the
            authorization server's health, and mcp-gate logs for fetch errors.

      # Warning: refresh failures are a liveness signal. The refresh goroutine
      # increments mcpgate_jwks_refresh_errors_total on every failure. A single
      # failure within 15 minutes is enough to alert — the default refresh
      # interval is 1h, so multiple failures inside a window shorter than that
      # indicates something is wrong even if keys are still cached.
      - uid: mcp-gate-jwks-refresh-errors
        title: mcp-gate JWKS Refresh Errors
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: increase(mcpgate_jwks_refresh_errors_total{job="mcp-gate"}[15m])
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
        # noDataState: Alerting — a scrape gap must not silently suppress a
        # refresh-failure signal. The target-down alert below covers the same
        # scrape gap at 5m, but this flip closes the sub-5m window where the
        # scrape is absent AND refreshes are failing.
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: >-
            {{ if $labels.service }}{{ $labels.service }}{{ else }}mcp-gate{{ end }}
            JWKS refresh is failing
          description: |
            The JWKS refresh goroutine reported one or more failures in the last
            15 minutes. Cached keys may still be serving validations, but the
            cache is going stale. Check mcp-gate logs and JWKS endpoint
            availability.

      # Warning: key set has not rotated in 90 days. The gauge is primed on
      # startup (auth.go:114) so this won't false-fire on a fresh container.
      # If the authorization server's signing-key rotation schedule slips, or
      # the refresh is silently returning stale keys, this catches it.
      - uid: mcp-gate-jwks-keys-stale
        title: mcp-gate JWKS Keys Stale
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: time() - mcpgate_jwks_last_key_change_timestamp_seconds{job="mcp-gate"}
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [7776000]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
        noDataState: OK
        execErrState: OK
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: >-
            {{ if $labels.service }}{{ $labels.service }}{{ else }}mcp-gate{{ end }}
            JWKS key set has not rotated in 90+ days
          description: |
            The JWKS key set last changed more than 90 days ago. This may
            indicate a stuck refresh that is silently returning the same keys,
            or a longer-than-expected key rotation cadence. The
            mcpgate_jwks_refresh_errors_total counter covers the liveness
            side — this signal is about whether rotation is actually happening.

  - orgId: 1
    name: mcp-gate-health
    folder: mcp-gate
    interval: 1m
    rules:
      # Critical: Prometheus cannot scrape mcp-gate. Without this, JWKS and
      # upstream alerts flip to NoData; this rule is the single source of
      # truth for "is mcp-gate reachable by the monitoring stack".
      - uid: mcp-gate-target-down
        title: mcp-gate Target Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: up{job="mcp-gate"}
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: >-
            {{ if $labels.service }}{{ $labels.service }}{{ else }}mcp-gate{{ end }}
            Prometheus target is down
          description: |
            Prometheus has not scraped mcp-gate for at least 5 minutes. The
            container may be crashed, the metrics port blocked, or the network
            path to the scrape target broken. All other mcp-gate alerts are
            effectively silenced until this is resolved.

      # Warning: the upstream MCP server is returning 5xx for >10% of requests.
      # Symptoms: upstream credential rotation missed, upstream OOM, or the
      # system it queries unavailable. The status_code label comes from the
      # proxy's ModifyResponse / ErrorHandler paths (see internal/proxy).
      - uid: mcp-gate-upstream-errors
        title: mcp-gate Upstream Error Ratio
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: |
                sum by (service) (rate(mcpgate_proxy_requests_total{job="mcp-gate",status_code=~"5.."}[5m]))
                /
                clamp_min(sum by (service) (rate(mcpgate_proxy_requests_total{job="mcp-gate"}[5m])), 0.001)
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.1]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
        # noDataState: OK — no traffic = no error ratio, don't wake anyone.
        # target-down covers the "mcp-gate itself is silent" case.
        noDataState: OK
        execErrState: Alerting
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: >-
            {{ if $labels.service }}{{ $labels.service }}{{ else }}mcp-gate{{ end }}
            upstream errors exceed 10%
          description: |
            More than 10% of proxied requests returned 5xx for 10 minutes.
            Check the upstream MCP server's health and the credentials it
            uses for its own backend. `clamp_min` on the denominator
            prevents division-by-zero flutter during low-traffic windows.

      # Warning: invalid-token rate spike. Catches signing-key rotation,
      # EXPECTED_AUDIENCE drift, or a broken Claude.ai client — failure modes
      # that JWKSRefreshErrorsTotal will NOT see (the AS can reply 200 with
      # a changed keyset faster than mcp-gate polls).
      - uid: mcp-gate-auth-failures
        title: mcp-gate Auth Failure Burst
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum by (service) (rate(mcpgate_auth_validations_total{job="mcp-gate",outcome="invalid_token"}[5m]))
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
        noDataState: OK
        execErrState: Alerting
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: >-
            {{ if $labels.service }}{{ $labels.service }}{{ else }}mcp-gate{{ end }}
            invalid-token rate exceeds 1/s
          description: |
            mcp-gate is rejecting more than 1 token per second as invalid for
            10 minutes. Likely causes: authorization-server signing-key rotation that
            mcp-gate hasn't refreshed yet, EXPECTED_AUDIENCE drift after a
            provider reconfig, or a misconfigured Claude.ai connector. Check
            recent authorization-server changes and the mcp-gate logs.
