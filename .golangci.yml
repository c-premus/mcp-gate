version: "2"

# Analyse at the module's LANGUAGE FLOOR, not at the toolchain it builds with.
# go.mod deliberately splits the two (`go 1.26` + `toolchain go1.27.0`) so that
# CodeQL's Go extractor can analyse this module with the runner image's own Go —
# see go.mod and systemPatterns.md, "The `go` Directive Is CodeQL's Language
# Version". Without this, golangci-lint takes its targeted version from the
# `toolchain` directive (verified 2026-08-26: a probe module with `go 1.26`
# alone lints clean under a go1.26-built binary, and refuses to load its config
# once `toolchain go1.27.0` is added), which is a version the code must NOT be
# written against.

run:
  go: "1.26"

linters:
  default: none
  enable:
    # Tier 1 — Bugs & correctness
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosec
    - bodyclose
    - nilerr
    - nilnesserr
    - noctx
    - spancheck

    # Tier 2 — Code quality & style
    - revive
    - gocritic
    - unconvert
    - unparam
    - misspell
    - errorlint
    - sloglint
    - promlinter
    - modernize

    # Tier 3 — Nice to have
    - gocyclo
    - nakedret
    - perfsprint
    - recvcheck
    - loggercheck
    - ineffassign

  exclusions:
    paths:
      - vendor

    rules:
      # internal/metrics is not a stdlib collision — runtime/metrics exists
      # but "metrics" is a standard name for Prometheus metric packages.
      - path: "internal/metrics/"
        linters: [revive]
        text: "var-naming"
      # run() returns *runResult for architectural consistency (ready channel
      # + return value) even though callers currently use only the channel.
      - path: "cmd/mcp-gate/main\\.go"
        linters: [unparam]
        text: "run - result"
      # modernize's errorsastype gates on whether errors.AsType EXISTS in the
      # stdlib it loaded (the go1.27 toolchain), not on the module's language
      # version — so it fires even with run.go pinned to the 1.26 floor above.
      # Taking the suggestion breaks the build at the floor and, through it,
      # CodeQL extraction. Drop this exclusion when the floor reaches 1.27.
      - path: "internal/proxy/proxy\\.go"
        linters: [modernize]
        text: "errorsastype"

  settings:
    gocyclo:
      min-complexity: 30

    nakedret:
      max-func-lines: 30

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      settings:
        hugeParam:
          sizeThreshold: 256
      disabled-checks:
        # sprintfQuotedString suggests %q but our auth.go uses fmt.Sprintf
        # for RFC 7235 WWW-Authenticate headers where "value" quoting is
        # handled by sanitizeQuotedString — Go %q escaping is wrong here.
        - sprintfQuotedString

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: range
        - name: receiver-naming
        - name: indent-error-flow
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id

    sloglint:
      kv-only: true
      args-on-sep-lines: false

    perfsprint:
      err-error: true
      errorf: true
      sprintf1: true

    gosec:
      excludes:
        # We intentionally don't set WriteTimeout for SSE streaming
        - G112
        # G704: SSRF via taint — checkHealth takes the URL as a parameter, which
        # is either derived from operator-controlled LISTEN_ADDR config via
        # healthcheckURL, or an httptest server URL in tests. Never user input.
        - G704
        # G706: Log injection via taint — slog structured logging JSON-encodes all
        # values as key-value pairs, never interpolating into log message strings.
        # This makes log injection via user-controlled fields (JWT claims, request
        # paths, IPs) a non-issue.
        - G706

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
