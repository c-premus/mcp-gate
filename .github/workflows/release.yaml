name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  DOCKERHUB_IMAGE: cpremus/mcp-gate
  GHCR_IMAGE: ghcr.io/c-premus/mcp-gate

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race ./...

  release:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7  # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7  # v4.5.1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: build/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest Docker Hub image
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-name: docker.io/${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest GHCR image
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa  # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: "OAuth 2.1 reverse proxy for MCP servers"

      - name: Clean up old GHCR versions
        # snok/container-retention-policy is a Rust/Docker action — no Node
        # runtime, so it sidesteps the GitHub Actions Node 20 deprecation
        # treadmill entirely. Upstream actions/delete-package-versions has
        # had no release since v5.0.0 (Jan 2024, Node 20).
        uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53  # v3.1.0
        continue-on-error: true
        with:
          account: user
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: mcp-gate
          tag-selection: untagged
          cut-off: 1d

      - name: Clean up old Docker Hub tags and images
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -uo pipefail
          NAMESPACE="cpremus"
          IMAGE="mcp-gate"
          KEEP=5

          # Authenticate — fail fast with diagnostic output
          RESPONSE=$(curl -s -w "\n%{http_code}" "https://hub.docker.com/v2/users/login/" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}")
          HTTP_CODE=$(echo "${RESPONSE}" | tail -1)
          BODY=$(echo "${RESPONSE}" | sed '$d')

          if [ "${HTTP_CODE}" -ne 200 ]; then
            echo "::error::Docker Hub login failed (HTTP ${HTTP_CODE})"
            exit 1
          fi
          HUB_TOKEN=$(echo "${BODY}" | jq -r .token)

          # Step 1: Delete old tags (keeps latest KEEP by last_updated)
          echo "Fetching tags..."
          TAGS=$(curl -sf "https://hub.docker.com/v2/repositories/${NAMESPACE}/${IMAGE}/tags/?page_size=100" \
            -H "Authorization: Bearer ${HUB_TOKEN}" \
            | jq -r "[.results | sort_by(.last_updated) | reverse | .[${KEEP}:][] | .name] | .[]") || true

          if [ -n "${TAGS}" ]; then
            for TAG in ${TAGS}; do
              echo "Removing tag ${IMAGE}:${TAG}"
              curl -sf -X DELETE "https://hub.docker.com/v2/repositories/${NAMESPACE}/${IMAGE}/tags/${TAG}/" \
                -H "Authorization: Bearer ${HUB_TOKEN}" || echo "  Warning: failed to delete tag ${TAG}"
            done
          else
            echo "No old tags to remove (≤${KEEP} tags)"
          fi

          # Step 2: Delete inactive images via Advanced Image Management API
          # status=inactive returns manifests with no tags AND not referenced by any tagged manifest
          echo "Fetching inactive images..."
          DIGESTS=$(curl -sf \
            "https://hub.docker.com/v2/namespaces/${NAMESPACE}/repositories/${IMAGE}/images?status=inactive&page_size=100&ordering=-last_activity" \
            -H "Authorization: Bearer ${HUB_TOKEN}" \
            | jq -r '[.results[].digest] | .[]') || true

          if [ -z "${DIGESTS}" ]; then
            echo "No inactive images to clean up"
            exit 0
          fi

          # Bulk delete by digest — actually reclaims storage
          MANIFESTS=$(echo "${DIGESTS}" \
            | jq -Rsc '[split("\n") | .[] | select(length > 0) | {repository: "'"${IMAGE}"'", digest: .}]')
          COUNT=$(echo "${DIGESTS}" | grep -c . || true)

          echo "Deleting ${COUNT} inactive image(s)"
          curl -sf -X POST \
            "https://hub.docker.com/v2/namespaces/${NAMESPACE}/repositories/${IMAGE}/images/delete" \
            -H "Authorization: Bearer ${HUB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"manifests\": ${MANIFESTS}, \"dry_run\": false}" || echo "Warning: bulk delete failed"

          echo "Docker Hub cleanup complete"
