name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  DOCKERHUB_IMAGE: cpremus/mcp-gate
  GHCR_IMAGE: ghcr.io/c-premus/mcp-gate

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race ./...

  release:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: build/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Docker Hub: attest to GitHub's store only. Do NOT push a referrer
      # manifest to Docker Hub — buildx already embeds SLSA provenance and
      # SBOMs inside the image manifest via `provenance: mode=max, sbom: true`,
      # and Docker Hub's public API cannot garbage-collect separate referrer
      # manifests once their subject is untagged (the Advanced Image
      # Management endpoints were removed from the public API in 2023).
      - name: Attest Docker Hub image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: docker.io/${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}

      - name: Attest GHCR image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Sigstore keyless signing — uses the workflow's OIDC token to obtain a
      # short-lived Fulcio cert, signs the image digest, and records the
      # signature in the public Rekor transparency log. Verifiable with:
      #   cosign verify <image>@<digest> \
      #     --certificate-identity-regexp 'https://github\.com/c-premus/mcp-gate/' \
      #     --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
      # GHCR: signature pushed as a referrer manifest in the registry.
      # Docker Hub: --upload=false records the signature in Rekor only, for
      # the same orphan-manifest reason as the Docker Hub attest step above.
      # Both steps retry: the public Fulcio/Rekor instances return transient
      # errors (DocuMCP-go's v0.32.3 release failed on a Fulcio 400 wrapping a
      # cancelled GCP KMS call), and cosign does not retry them itself. A
      # retry after a partial success at worst records a second, equally
      # valid signature.
      - name: Sign GHCR image
        env:
          IMAGE_REF: ${{ env.GHCR_IMAGE }}@${{ steps.push.outputs.digest }}
        run: |
          for attempt in 1 2 3; do
            cosign sign --yes "$IMAGE_REF" && exit 0
            echo "::warning::cosign sign attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 20))
          done
          exit 1

      - name: Sign Docker Hub image
        env:
          IMAGE_REF: docker.io/${{ env.DOCKERHUB_IMAGE }}@${{ steps.push.outputs.digest }}
        run: |
          for attempt in 1 2 3; do
            cosign sign --yes --upload=false "$IMAGE_REF" && exit 0
            echo "::warning::cosign sign attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 20))
          done
          exit 1

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa  # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: "OAuth 2.1 reverse proxy for MCP servers"

      - name: Clean up old GHCR versions
        # snok/container-retention-policy is a Rust/Docker action — no Node
        # runtime, so it sidesteps the GitHub Actions Node 20 deprecation
        # treadmill entirely. Upstream actions/delete-package-versions has
        # had no release since v5.0.0 (Jan 2024, Node 20).
        uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53  # v3.1.0
        continue-on-error: true
        with:
          account: user
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: mcp-gate
          tag-selection: untagged
          cut-off: 1d

      # Docker Hub tag retention. We can't prune untagged manifests from here:
      # the "Advanced Image Management" API (/v2/namespaces/.../images) was
      # removed from public access in 2023 and now only backs the web UI.
      # Orphan manifests left behind when tags expire rely on Docker Hub's
      # own background GC. To avoid *generating* additional orphans, we also
      # do not push referrer attestations or signatures to Docker Hub (see
      # the attest and sign steps above).
      - name: Clean up old Docker Hub tags
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          NAMESPACE="cpremus"
          IMAGE="mcp-gate"
          KEEP=5

          # Authenticate — fail fast with diagnostic output
          LOGIN_RESP=$(curl -sS -w "\n%{http_code}" "https://hub.docker.com/v2/users/login/" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}")
          LOGIN_CODE=$(echo "${LOGIN_RESP}" | tail -n1)
          LOGIN_BODY=$(echo "${LOGIN_RESP}" | sed '$d')
          if [ "${LOGIN_CODE}" != "200" ]; then
            echo "::error::Docker Hub login failed (HTTP ${LOGIN_CODE})"
            exit 1
          fi
          HUB_TOKEN=$(printf '%s' "${LOGIN_BODY}" | jq -r .token)

          # Page through every tag (not just the first 100)
          TAGS_FILE=$(mktemp)
          URL="https://hub.docker.com/v2/repositories/${NAMESPACE}/${IMAGE}/tags/?page_size=100&ordering=last_updated"
          while [ -n "${URL}" ] && [ "${URL}" != "null" ]; do
            PAGE=$(curl -sSf -H "Authorization: Bearer ${HUB_TOKEN}" "${URL}")
            echo "${PAGE}" | jq -r '.results[] | "\(.last_updated)\t\(.name)"' >> "${TAGS_FILE}"
            URL=$(echo "${PAGE}" | jq -r '.next // ""')
          done

          # Newest first, strip timestamp, skip the KEEP newest, emit the rest
          DELETE_FILE=$(mktemp)
          sort -r "${TAGS_FILE}" | cut -f2- | tail -n "+$((KEEP + 1))" > "${DELETE_FILE}"

          TOTAL=$(wc -l < "${TAGS_FILE}" | tr -d ' ')
          DELETE_COUNT=$(wc -l < "${DELETE_FILE}" | tr -d ' ')
          echo "Tags: total=${TOTAL}, keep=${KEEP}, to-delete=${DELETE_COUNT}"

          if [ "${DELETE_COUNT}" = "0" ]; then
            echo "Nothing to delete."
            exit 0
          fi

          FAIL=0
          while IFS= read -r TAG; do
            [ -z "${TAG}" ] && continue
            HTTP=$(curl -sS -o /dev/null -w "%{http_code}" -X DELETE \
              "https://hub.docker.com/v2/repositories/${NAMESPACE}/${IMAGE}/tags/${TAG}/" \
              -H "Authorization: Bearer ${HUB_TOKEN}")
            if [ "${HTTP}" = "204" ] || [ "${HTTP}" = "200" ]; then
              echo "  deleted: ${TAG}"
            else
              echo "::warning::failed to delete tag ${TAG} (HTTP ${HTTP})"
              FAIL=$((FAIL + 1))
            fi
          done < "${DELETE_FILE}"

          echo "Done. deleted=$((DELETE_COUNT - FAIL)), failed=${FAIL}"
          [ "${FAIL}" = "0" ]
