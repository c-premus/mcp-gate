# Example Docker Compose for mcp-gate
# Adapt to your environment and upstream MCP server.

services:
  mcp-gate:
    image: cpremus/mcp-gate:latest@sha256:257d8998e6a77d13e97879158566315046ee65e0443ed1edf7b3b190ca06ff73
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      LISTEN_ADDR: "0.0.0.0:8080"
      UPSTREAM_URL: "http://mcp-server:8000"
      RESOURCE_URI: "https://mcp.example.com"
      AUTHORIZATION_SERVER: "https://auth.example.com/application/o/mcp/"
      JWKS_URI: "https://auth.example.com/application/o/mcp/jwks/"
      EXPECTED_ISSUER: "https://auth.example.com/application/o/mcp/"
      EXPECTED_AUDIENCE: "your-oauth-client-id"
      LOG_LEVEL: "info"
      # Soft memory cap so the Go GC keeps heap below this before host OOM
      # kicks in. See docs/setup.md "Deploy Behavior" for tuning guidance.
      GOMEMLIMIT: "256MiB"
    healthcheck:
      test: ["/mcp-gate", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
